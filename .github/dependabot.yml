version: 2
updates:
  - package-ecosystem: pip
    directory: backend
    schedule: { interval: weekly, day: monday, time: "06:00" }
    labels: [deps, backend]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: frontend
    schedule: { interval: weekly, day: monday, time: "06:00" }
    labels: [deps, frontend]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday, time: "06:00" }
    labels: [deps, ci]
