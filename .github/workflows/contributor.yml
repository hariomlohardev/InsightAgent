name: Contributor automation - label, welcome, auto-request review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = `👋 **Welcome @${{ github.event.pull_request.user.login }} - thanks for your first PR to InsightAgent!**

            **You don’t need to do anything else.** CI will automatically:
            - run \`black --check\`, \`ruff\`, \`mypy\`, \`py_compile\` (see \`make lint\`)
            - run \`pytest -q\` on 3.10/3.11/3.12 (with and without Postgres/Redis - filesystem fallback keeps it green)
            - run \`bench_profile 100k\` gate (<1s) and \`bench_read\` streaming check
            - run Streamlit headless \`AppTest\` for empty-profile crash check (\`IndexError\` guard)
            - check \`docker compose config\` stays valid

            All results appear as **Checks** below. If a check fails, click **Details** next to it - the log shows the exact command to run locally (e.g. \`make format\`).

            A maintainer will review once **gate** is ✅ green - just one review, then merge. See \`CONTRIBUTING.md\` for the 30-second \`make install && docker-compose up\` flow.`;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

  label:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number });
            const labels = new Set();
            const paths = files.map(f=>f.filename);
            if (paths.some(p=>p.startsWith('backend/'))) labels.add('backend');
            if (paths.some(p=>p.startsWith('frontend/'))) labels.add('frontend');
            if (paths.some(p=>p.startsWith('scripts/bench'))) labels.add('perf');
            if (paths.some(p=>p.includes('docker-compose'))) labels.add('docker');
            if (labels.size) await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, labels: [...labels] });

  auto-assign:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.requested_reviewers.length == 0
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers: ['hariomlohardev']
              });
            } catch(e) { console.log('auto-assign soft fail', e.message); }
