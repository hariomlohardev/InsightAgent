<!doctype html>
<html lang="en">
<head>

<title>404 — InsightAgent</title>

<style>
:root{--pink:#FF2D6B;--pink-soft:#FFE4EC;--black:#0A0A0A;--paper:#FFFEFB;--yellow:#FFD600}

.display{font-family:"Archivo Black",Impact,sans-serif;line-height:.9;letter-spacing:-.03em;text-transform:uppercase}

</head>
<body>
<header class="border-b-[3px] border-[var(--black)] bg-[var(--paper)] sticky top-0">
  <div class="max-w-[1100px] mx-auto px-4 h-[64px] flex items-center justify-between">

    <p class="mono text-xs mt-4">Correct URL: <code class="bg-white brutal px-1">hariomlohardev.github.io/InsightAgent/docs/benchmarks.html</code> — also works at <code class="bg-white brutal px-1">/benchmarks.html</code> via redirect.</p>
  </div>

<script>document.getElementById('path').textContent = location.pathname;</script>
